name: Build and Deploy Future Tech

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Sass
        run: npx sass styles/main.scss:css/main.css --style=compressed

      - name: Clean up development files
        run: |
          rm -rf .github/
          rm -rf node_modules/
          rm -rf styles/
          rm -f .gitignore package.json package-lock.json README.md css/main.css.map

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages